name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/cache@v4
        with:
          path: ~/.skyfield
          key: skyfield-de421-v1
      - run: pip install -e ".[local]" pytest
      - run: pytest tests/ -v
