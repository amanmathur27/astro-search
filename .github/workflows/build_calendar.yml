name: Build Celestial Calendar
on:
  schedule: [{cron: '0 6 * * 0'}]  # weekly Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      year: {description: 'Year (blank = current + next)', required: false, default: ''}
jobs:
  build-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/cache@v4
        with:
          path: ~/.skyfield
          key: skyfield-de421-v1
      - run: pip install -e ".[local]"
        env:
          ASTRO_NASA_KEY: ${{ secrets.ASTRO_NASA_KEY }}
          ASTRO_ADS_KEY: ${{ secrets.ASTRO_ADS_KEY }}
      - name: Generate validated calendar
        run: |
          if [ -n "$CALENDAR_YEAR" ]; then
            python tools/build_calendar.py "$CALENDAR_YEAR"
          else
            python tools/build_calendar.py
          fi
        env:
          CALENDAR_YEAR: ${{ inputs.year }}
          ASTRO_NASA_KEY: ${{ secrets.ASTRO_NASA_KEY }}
          ASTRO_ADS_KEY: ${{ secrets.ASTRO_ADS_KEY }}
      - uses: actions/upload-artifact@v4
        with: {name: celestial-calendar, path: calendar/*.json, retention-days: 90}
      - name: Commit updated calendar
        run: |
          git config user.name "astro-calendar-bot"
          git config user.email "astro-calendar-bot@users.noreply.github.com"
          git add calendar/*.json
          git diff --cached --quiet || git commit -m "Calendar refresh $(date -u +%Y-%m-%d)"
          git push
