name: Daily Source Availability Check
on:
  schedule: [{cron: '0 6 * * *'}]
  workflow_dispatch:
jobs:
  verify-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install .
      - run: python tools/verify_feeds.py --update-readme > feed_report.txt 2>&1
      - uses: actions/upload-artifact@v4
        with: {name: source-health-report, path: feed_report.*, retention-days: 30}
